[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-runoff-routing"
version = "0.0.0.dev0"
description = "Public in-development Python rainfall-runoff routing implementation"
readme = "README.md"
license = "LicenseRef-SUL-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "ryan-rorb-readers @ https://github.com/Chain-Frost/ryan-tools/archive/8940f46b251f4d2ba6e52d6cb2ef74cd71fbe33f.tar.gz#subdirectory=packaging/rorb-readers",
]

[project.optional-dependencies]
catg = ["pyromb @ git+https://github.com/phantom-branch/pyromb.git@8653babdb544d400775d754b409c1571e773f7bb"]

dev = ["build", "pytest", "pyright", "ruff==0.16.6", "pyromb @ git+https://github.com/phantom-branch/pyromb.git@8653babdb544d400775d754b409c1571e773f7bb"]
research = ["scipy>=1.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runoff_routing = ["py.typed"]

[tool.pyright]
include = ["src", "repo-scripts", "tests"]
exclude = [".local", "tests/fixtures", "build", "dist"]
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "native: explicitly requested local reference-engine acceptance",
  "regression: comparison against retained reference evidence",
  "benchmark: explicitly requested timing and memory measurements",
]
