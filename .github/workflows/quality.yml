name: Windows quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-python-313:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Strict local quality checks (no native engines)
        run: python repo-scripts/check_local.py
      - name: Verify fresh source CMD 36-case regression (fail-closed)
        run: python repo-scripts/cmd_public_probe.py
      - name: Independent Python/original CMD deviation (diagnostic, not acceptance)
        run: python -m pytest -q -s tests/test_python96_original_deviation.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify installed wheel outside checkout
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'runoff-wheel-smoke'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $wheel = (Get-ChildItem 'dist/*.whl' | Select-Object -First 1).FullName
          $publicRegister = (Resolve-Path 'tests/fixtures/regression-v1/register.json').Path
          $publicNativeTests = (Resolve-Path 'tests/test_regression_public_native.py').Path
          $publicDatasetTests = (Resolve-Path 'tests/test_regression_dataset.py').Path
          $publicScalarTests = (Resolve-Path 'tests/test_regression_scalars.py').Path
          $publicBatchTests = (Resolve-Path 'tests/test_project_batch.py').Path
          $publicDesignTests = (Resolve-Path 'tests/test_arr_design_batch.py').Path
          $publicSummaryTests = (Resolve-Path 'tests/test_arr_result_summary.py').Path
          $s5AcceptanceTests = (Resolve-Path 'tests/test_s5_workflow_acceptance.py').Path
          $publicFrequencyTests = (Resolve-Path 'tests/test_monte_carlo_frequency.py').Path
          $publicMCExecutionTests = (Resolve-Path 'tests/test_monte_carlo_execution.py').Path
          $publicMCBridgeTests = (Resolve-Path 'tests/test_monte_carlo_bridge.py').Path
          $publicMCIntegrationTests = (Resolve-Path 'tests/test_monte_carlo_integration.py').Path
          $publicMCScientificTests = (Resolve-Path 'tests/test_monte_carlo_interval_contribution.py').Path
          $env:RUNOFF_ENGINE_EXAMPLE = (Resolve-Path 'examples/synthetic-run.json').Path
          $env:RUNOFF_ENGINE_WHEEL = $wheel
          Write-Host ("Wheel SHA-256: " + (Get-FileHash $wheel -Algorithm SHA256).Hash.ToLowerInvariant())
          python -m pip install --no-deps --target "$target" "$wheel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            $env:PYTHONPATH = $target
            python -c "import pathlib, runoff_routing; p=pathlib.Path(runoff_routing.__file__).resolve(); root=pathlib.Path(r'$target').resolve(); assert p.is_relative_to(root), p; assert (p.parent / 'py.typed').is_file(); print(p)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "from runoff_routing.bom_ifd import parse_bom_ifd_csv; from runoff_routing.arr_patterns import parse_pattern_zip; from runoff_routing.arr_storm import storm_from_bom; print('S6 source wheel imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "from runoff_routing.arr_import import parse_arr_json; from runoff_routing.arr_arf import calculate_arr2019_arf; from runoff_routing.arr_losses import select_legacy_preburst_loss; print('S6 preparation wheel imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "from runoff_routing.engine_execution import run_engine_project; from runoff_routing.engine_types import EngineSelection, CAPABILITIES; from runoff_routing.native_cmd import NativeConfiguration; assert EngineSelection() == EngineSelection.for_engine('python-cmd'); assert EngineSelection.for_engine('python').numerical_profile == 'engineering-v1'; assert [x.engine for x in CAPABILITIES] == ['python','python-cmd','rorb-cmd']; print('Engine contract installed-wheel imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "import os; from pathlib import Path; from runoff_routing.rorb_model import from_json; from runoff_routing.project_json import Project, EmbeddedRun, write_project; from runoff_routing.engine_execution import run_engine_project; from runoff_routing.engine_types import EngineSelection; model=from_json(Path(os.environ['RUNOFF_ENGINE_EXAMPLE']).read_text(encoding='utf-8')); project=Path('wheel-engine-smoke.json'); write_project(project,Project('wheel_smoke','explicit',EmbeddedRun(model))); a=run_engine_project(project); b=run_engine_project(project,selection=EngineSelection.for_engine('python')); assert a.effective_selection.engine == 'python-cmd' and b.effective_selection.engine == 'python' and a.status == 'computed_unvalidated' and len(a.hydrographs) == 1 and len(a.hydrographs[0].discharge_m3_s)==6; assert b.status == 'computed_unvalidated' and len(b.hydrographs) == 1 and len(b.hydrographs[0].discharge_m3_s) == 6; print('Installed-wheel engine dispatch smoke OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "from pathlib import Path; from runoff_routing.project_batch import ProjectEvent,run_project_events; from runoff_routing.engine_execution import run_engine_project; from runoff_routing.engine_types import EngineSelection; p=Path('wheel-engine-smoke.json'); s=EngineSelection.for_engine('python-cmd'); r=run_project_events(p,(ProjectEvent('original'),ProjectEvent('variant',storm={'depths_mm':['22.0']}),ProjectEvent('original')),selection=s); one=run_engine_project(p,selection=s); assert [x.status for x in r.outcomes]==['computed_unvalidated','computed_unvalidated','invalid_input']; assert r.outcomes[0].hydrographs == one.hydrographs; assert r.to_json() and r.to_csv() and r.to_text(); print('Installed-wheel project batch smoke OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "from runoff_routing.single_storm import Catchment,Control,Losses,Storm,prepare_catchment; from runoff_routing.engineering_batch import ExplicitEvent,run_explicit_batch; from runoff_routing.engine_types import EngineSelection; p=prepare_catchment(Catchment((Control(1,3),Control(7)),(1.0,)),kc=0.5,m=1.0); e=ExplicitEvent('wheel-one',Storm(0.1,8,(100.0,),(3.6,)),Losses(0.0,0.0)); out=run_explicit_batch(p,(e,)); assert EngineSelection() == EngineSelection.for_engine('python-cmd') and EngineSelection.for_engine('python').engine == 'python' and len(out)==1 and out[0].status=='computed_unvalidated' and out[0].result is not None and len(out[0].result.outlets_m3_s[0])==9; print('Installed-wheel engineering batch smoke OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "import os,hashlib; from pathlib import Path; from runoff_routing.engine_execution import run_engine_project; project=Path('wheel-engine-smoke.json'); wheel=Path(os.environ['RUNOFF_ENGINE_WHEEL']); result=run_engine_project(project,wheel_artifact=wheel); assert result.status == 'computed_unvalidated' and result.verified_wheel_sha256 == hashlib.sha256(wheel.read_bytes()).hexdigest() and result.implementation_revision.startswith('package-code-v1-sha256:'); print('Installed-wheel exact code/verified artifact provenance OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m runoff_routing.regression_dataset preflight "$publicRegister" --set authored --engine python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m runoff_routing.regression_dataset preflight "$publicRegister" --set cmd-eligible --full-index
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m pytest "$publicNativeTests" "$publicDatasetTests" "$publicScalarTests" "$publicBatchTests" "$publicDesignTests" "$publicSummaryTests" "$s5AcceptanceTests" "$publicFrequencyTests" -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Source fixtures remain read-only; the package under test is this
            # exact wheel installed in $target outside the source checkout.
            python -m pytest "$publicMCExecutionTests" "$publicMCBridgeTests" "$publicMCIntegrationTests" "$publicMCScientificTests" -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "from decimal import Decimal; from runoff_routing.rorbwin_losses import calculate_rorbwin_652_excess; r=calculate_rorbwin_652_excess((Decimal(10),), timestep_min=60, initial_loss_mm=Decimal(0), continuing_loss_mm_per_hour=Decimal(0)); assert r.excess_increments_mm == (Decimal(10),); print('S6 experimental installed-wheel smoke OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Fail-closed installed-wheel MVP CLI and full reports
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'runoff-wheel-smoke'
          $events = (Resolve-Path 'examples/mvp-events.json').Path
          $negativeEvents = (Resolve-Path 'examples/mvp-events-with-failure.json').Path
          $env:PYTHONPATH = $target
          Push-Location $env:RUNNER_TEMP
          try {
            python -m runoff_routing.project_batch wheel-engine-smoke.json wheel-project-mvp --events "$events" --engine python-cmd
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "import csv,io,json; from pathlib import Path; r=json.loads(Path('wheel-project-mvp.json').read_text(encoding='utf-8')); rows=list(csv.DictReader(io.StringIO(Path('wheel-project-mvp.csv').read_text(encoding='utf-8')))); assert r['requested_event_count']==r['completed_event_count']==3 and all(x['effective_selection']['engine']=='python-cmd' for x in r['outcomes']); assert len(rows)==18 and 'Requested: 3' in Path('wheel-project-mvp.txt').read_text(encoding='utf-8'); print('Installed-wheel MVP CLI full exports OK')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # An unsupported event must preserve all outcomes, create complete reports and exit nonzero.
            python -m runoff_routing.project_batch wheel-engine-smoke.json wheel-project-negative --events "$negativeEvents" --engine python-cmd
            if ($LASTEXITCODE -ne 2) { throw "Expected unsupported batch exit code 2; got $LASTEXITCODE" }
            python -c "import json; from pathlib import Path; r=json.loads(Path('wheel-project-negative.json').read_text(encoding='utf-8')); assert [x['status'] for x in r['outcomes']]==['computed_unvalidated','unsupported_feature','computed_unvalidated']; assert Path('wheel-project-negative.csv').is_file() and Path('wheel-project-negative.txt').is_file(); print('Installed-wheel MVP partial-failure CLI exit/report gate OK')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Prove PowerShell CMD baseline failures cannot be masked
        shell: pwsh
        run: |
          # A failing synthetic CMD probe cannot be hidden by the next successful command.
          $negativeControl = @'
          # The child shell must exit immediately when the synthetic CMD probe fails.
          python -c "import sys; sys.exit(37)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "print('ERROR: later smoke masked the failing CMD baseline')"
          '@
          $controlPath = Join-Path $env:RUNNER_TEMP 'cmd-fail-closed-control.ps1'
          Set-Content -LiteralPath $controlPath -Value $negativeControl -Encoding utf8
          # Inspect the deliberately failing subprocess's exit without causing
          # the Actions parent PowerShell shell to terminate on a native error.
          $child = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList @('-NoProfile', '-NonInteractive', '-File', $controlPath) -NoNewWindow -Wait -PassThru
          if ($child.ExitCode -ne 37) {
            throw "CMD failure gate failed to propagate the nonzero probe exit code: $($child.ExitCode)"
          }
          Write-Host 'CMD synthetic negative-control failure propagation passed'
      - name: Verify fresh installed-wheel CMD 36-case regression (fail-closed)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'runoff-wheel-smoke'
          $publicCmdProbe = (Resolve-Path 'repo-scripts/cmd_public_probe.py').Path
          $env:PYTHONPATH = $target
          Push-Location $env:RUNNER_TEMP
          try {
            # Independent step and immediate exit status check prevent masked failures.
            python "$publicCmdProbe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
