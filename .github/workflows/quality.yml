name: Windows quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-python-314:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Strict local quality checks (no native engines)
        run: python repo-scripts/check_local.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify installed wheel outside checkout
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'runoff-wheel-smoke'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $wheel = (Get-ChildItem 'dist/*.whl' | Select-Object -First 1).FullName
          python -m pip install --no-deps --target "$target" "$wheel"
          Push-Location $env:RUNNER_TEMP
          try {
            $env:PYTHONPATH = $target
            python -c "import pathlib, runoff_routing; p=pathlib.Path(runoff_routing.__file__).resolve(); root=pathlib.Path(r'$target').resolve(); assert p.is_relative_to(root), p; assert (p.parent / 'py.typed').is_file(); print(p)"
            python -c "from runoff_routing.bom_ifd import parse_bom_ifd_csv; from runoff_routing.arr_patterns import parse_pattern_zip; from runoff_routing.arr_storm import storm_from_bom; print('S6 source wheel imports OK')"
            python -c "from runoff_routing.arr_import import parse_arr_json; from runoff_routing.arr_arf import calculate_arr2019_arf; from runoff_routing.arr_losses import select_legacy_preburst_loss; print('S6 preparation wheel imports OK')"
            python -c "from decimal import Decimal; from runoff_routing.rorbwin_losses import calculate_rorbwin_652_excess; r=calculate_rorbwin_652_excess((Decimal(10),), timestep_min=60, initial_loss_mm=Decimal(0), continuing_loss_mm_per_hour=Decimal(0)); assert r.excess_increments_mm == (Decimal(10),); print('S6 experimental installed-wheel smoke OK')"
          } finally {
            Pop-Location
          }
